name: Build Firmware

on:
  push:
    branches: [ "main", "feature/dshot600-esc-rpm-telemetry", "feature/dshot600-rpm-rx-prototype", "feature/dshot300-bidir-rpm" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout SOES
        run: |
          git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure CMake
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
            --preset Release \
            -S ${{ github.workspace }} \
            -B ${{ github.workspace }}/build/Release

      - name: Build firmware
        run: |
          cmake --build ${{ github.workspace }}/build/Release \
            --target EcatV2_AX58100_H750_Universal

      - name: Compile opt-in TIM2 bench receiver (compile-only, unverified)
        if: github.ref_name == 'feature/dshot600-rpm-rx-prototype' || github.ref_name == 'feature/dshot300-bidir-rpm'
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release --preset Release \
            -DAIM_DSHOT_RPM_LAB_RX=ON \
            -S ${{ github.workspace }} \
            -B ${{ github.workspace }}/build/Lab
          cmake --build ${{ github.workspace }}/build/Lab \
            --target EcatV2_AX58100_H750_Universal
          echo "DO NOT FLASH: lab variant is NOT hardware-validated"

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: ${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.elf
