name: Build 6-IMU Slave Firmware

# CI trigger after enabling Actions on this fork.
on:
  push:
    branches:
      - "feature/6imu-large-pdo"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout SOES
        run: |
          git submodule update --init --recursive --force

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Apply and verify 6-IMU FDCAN settings
        run: |
          python3 tools/apply_6imu_fdcan_config.py

      - name: Configure CMake
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
            --preset Release \
            -S ${{ github.workspace }} \
            -B ${{ github.workspace }}/build/Release

      - name: Build firmware
        run: |
          cmake --build ${{ github.workspace }}/build/Release \
            --target EcatV2_AX58100_H750_Universal

      - name: Export HEX and BIN
        run: |
          ELF="${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.elf"
          arm-none-eabi-objcopy -O ihex "$ELF" "${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.hex"
          arm-none-eabi-objcopy -O binary "$ELF" "${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.bin"
          arm-none-eabi-size "$ELF"
          ls -lh \
            "${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.elf" \
            "${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.hex" \
            "${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.bin"

      - name: Upload flashable firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: six-imu-slave-firmware
          path: |
            ${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.elf
            ${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.hex
            ${{ github.workspace }}/build/Release/EcatV2_AX58100_H750_Universal.bin
